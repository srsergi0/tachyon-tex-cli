name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, target: x86_64-pc-windows-msvc, platform: windows-x64}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc, platform: windows-arm64}
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-musl, platform: linux-x64}
          - {os: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl, platform: linux-arm64}
          - {os: macos-15-intel, target: x86_64-apple-darwin, platform: macos-x64}
          - {os: macos-15, target: aarch64-apple-darwin, platform: macos-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TACHYON_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with: {node-version: '24'}
      - name: Install Rust and target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Linux static linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools fontconfig fonts-dejavu-core
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'build.rs') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }} -- --test-threads=1
      - run: cargo build --locked --target ${{ matrix.target }}
      - name: Test installer and real background preview
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          export TACHYON_BINARY="$PWD/target/${{ matrix.target }}/debug/tachyon-tex$suffix"
          npm run check
          npm test
          npm run test:full
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package verified binaries and licenses
        shell: bash
        run: |
          tag='${{ github.ref_name }}'
          if [[ "$tag" != v* ]]; then tag="v$(node -p "require('./package.json').version")"; fi
          node scripts/package.mjs '${{ matrix.target }}' '${{ matrix.platform }}' "$tag"
          tar -czf "dist/tachyon-tex-$tag-${{ matrix.platform }}.tar.gz" -C dist/packages "tachyon-tex-$tag-${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/tachyon-tex-v*-${{ matrix.platform }}${{ startsWith(matrix.platform, 'windows') && '.exe' || '' }}
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with: {path: dist, merge-multiple: true}
      - name: Create checksum manifest and skill archive
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          for archive in dist/*.tar.gz; do sha256sum "$archive" >> dist/SHA256SUMS; done
          sed -i 's#  dist/#  #' dist/SHA256SUMS
          tar -czf "dist/tachyon-tex-skill-${GITHUB_REF_NAME}.tar.gz" -C skills tachyon-tex
          sha256sum "dist/tachyon-tex-skill-${GITHUB_REF_NAME}.tar.gz" | sed 's#  dist/#  #' >> dist/SHA256SUMS
      - uses: actions/attest-build-provenance@v4.2.2
        with: {subject-path: 'dist/tachyon-tex-v*'}
      - name: Publish release after all six platforms pass
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/tachyon-tex-* dist/SHA256SUMS --title "Tachyon TeX $GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md --verify-tag
