[package]
name = "tachyon-tex"
version = "2.0.0"
edition = "2021"
license-file = "LICENSE"
description = "Portable LaTeX compiler for agents and humans"
repository = "https://github.com/srsergi0/tachyon-tex-cli"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
regex = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
self-replace = "1.5"
semver = "1"

[build-dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true